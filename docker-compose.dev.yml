services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: movie
      POSTGRES_PASSWORD: movie
      POSTGRES_DB: movie_streamer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie -d movie_streamer"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "corepack enable &&
      pnpm install &&
      pnpm --filter @movie-streamer/shared build &&
      pnpm --filter @movie-streamer/api dev"
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://movie:movie@postgres:5432/movie_streamer
      APP_MODE: production
      PORT: 3001
      NODE_ENV: development
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "corepack enable &&
      pnpm install &&
      pnpm --filter @movie-streamer/web dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_API_TARGET: http://api:3001
    volumes:
      - .:/app
    depends_on:
      - api

volumes:
  postgres_data:
